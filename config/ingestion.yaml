
available_environments:
  - DEV
  - QA
  - PRE
  - PROD

source:
  db_schema: snapshot_gis_go

templates:
  - XV_pipe

storage:
  container: xv-dataset

  paths:
    raw: pruebas/raw
    standard: pruebas/standard
    quarantine: pruebas/quarantine

data_quality:
  core_fields:
    - id
    - name
    - geom
  non_null_fields:
    - id
    - name
  id_column: id
  geometry_column: geom

anonymization:
  enabled: true
  text_columns:
      - XV_installation_location
  geometry_columns:
    - geom

dmd:
  asset_name_prefix: "TFMDFP - "
  code_reference_prefix: "TFMDFP - "
  origin_id: 1
  consumer_application_id: 1
  main_hierarchy_parent: 123456
  batch_size: 100

quality_threshold:
  max_quarantine_ratio: 0.2