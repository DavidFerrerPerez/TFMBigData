
available_environments:
  - DEV
  - QA
  - PRE
  - PROD

source:
  db_schema: assets

templates:
  - XV_pipe

storage:
  container: xv-dataset

  paths:
    raw: pruebas/raw
    standard: pruebas/standard
    quarantine: pruebas/quarantine

data_quality:
  core_fields:
    - id
    - name
    - geom
  non_null_fields:
    - id
    - name
  id_column: id
  geometry_column: geom

anonymization:
  text_columns:
      - XV_installation_location
  geometry_columns:
    - geom

main_hierarchy_parent: 123456

batch_size: 100

quarantine:
  enabled: true

  format: parquet

  include_source_record: true
  include_standard_payload: true

  retention_days: 90

  retry:
    max_attempts: 3
    initial_delay_seconds: 2

  thresholds:
    max_ratio: 0.01
    max_records: 1000