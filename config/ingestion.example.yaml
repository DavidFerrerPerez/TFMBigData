available_environments:
  - DEV
  - PRE
  - PROD

source:
  db_schema: example_schema

templates:
  - XV_pipe

storage:
  container: example-container
  paths:
    raw: raw
    standard: standard
    quarantine: quarantine

data_quality:
  core_fields:
    - id
    - name
    - geometry
  non_null_fields:
    - id
    - name
  id_column: id
  geometry_column: geometry

pseudonymization:
  enabled: true
  text_columns:
    - address
  geometry_columns:
    - geometry

dmd:
  asset_name_prefix: example_
  code_reference_prefix: example_
  origin_id: 1
  consumer_application_id: 1
  main_hierarchy_parent: 1
  batch_size: 100

quality_threshold:
  max_quarantine_ratio: 0.1